<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Solar System Logo</title>
  <desc id="desc">Abstract solar system icon with a central sun and orbiting planets.</desc>
  <!-- Space background -->
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffeb99"/>
      <stop offset="45%" stop-color="#ffc94a"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </radialGradient>
    <radialGradient id="space" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="60%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#space)"/>

  <!-- Orbits -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#2fd3ff" stroke-width="1.6" stroke-opacity="0.9"/>
  <circle cx="32" cy="32" r="11" fill="none" stroke="#81e6ff" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="2 3"/>

  <!-- Central sun -->
  <circle cx="32" cy="32" r="6.5" fill="url(#sunGlow)"/>

  <!-- Planets -->
  <!-- Outer orbit planet -->
  <circle cx="49" cy="32" r="3.2" fill="#4fd1c5"/>
  <!-- Inner orbit planet -->
  <circle cx="32" cy="21" r="2.4" fill="#7f9cff"/>

  <!-- Accent arc suggesting motion -->
  <path d="M16 30.5a17 17 0 0 1 10.5-12.4" fill="none" stroke="#4fd1c5" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
