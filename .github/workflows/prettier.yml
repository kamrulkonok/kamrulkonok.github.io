name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
      - name: Install dependencies 💾
        run: npm ci
      - name: Prettier Check 🔎
        id: prettier
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            git ls-files -z > changed-files.txt
          else
            git diff --name-only -z --diff-filter=ACMR "$base_sha" "$GITHUB_SHA" > changed-files.txt
          fi

          mapfile -d '' files < changed-files.txt
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files to format-check."
            exit 0
          fi

          npx prettier --check --ignore-unknown "${files[@]}"
      - name: Create diff 📝
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        run: |
          mapfile -d '' files < changed-files.txt
          npx prettier --write --ignore-unknown "${files[@]}"
          git diff -- "${files[@]}" > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt
      - name: Upload html diff ⬆️
        id: artifact-upload
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: HTML Diff
          path: diff.html
          retention-days: 7
      - name: Dispatch information to repository 🗣️
        if: ${{ failure() && steps.prettier.conclusion == 'failure' && github.event_name == 'pull_request' }}
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: prettier-failed-on-pr
          client-payload: '{"pr_number": "${{ github.event.number }}", "artifact_url": "${{ steps.artifact-upload.outputs.artifact-url }}", "run_id": "${{ github.run_id }}"}'
